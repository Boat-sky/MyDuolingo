<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">MyDuolingo — ฝึกศัพท์จีน Data Center</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- top bar -->
  <header id="topbar">
    <div class="stat" data-i18n-title="streakTitle" title="สตรีค (วันติดต่อกัน)">🔥 <span id="stat-streak">0</span></div>
    <div class="stat" data-i18n-title="xpTitle" title="XP รวม">⚡ <span id="stat-xp">0</span></div>
    <div class="stat" data-i18n-title="heartsTitle" title="หัวใจ">❤️ <span id="stat-hearts">5</span></div>
    <span id="sync-status" class="sync-status offline" data-i18n="offline">ออฟไลน์</span>
    <div class="ui-lang-toggle">
      <button id="ui-lang-th" class="ui-lang-btn active">TH</button>
      <button id="ui-lang-en" class="ui-lang-btn">EN</button>
    </div>
    <button id="btn-signin" class="btn-account" data-i18n="signIn">เข้าสู่ระบบด้วย Google</button>
    <button id="btn-signout" class="btn-account hidden" data-i18n="signOut">ออกจากระบบ</button>
  </header>

  <!-- home: unit path -->
  <main id="screen-home" class="screen">
    <div class="lang-toggle" id="lang-toggle-wrap">
      <button id="lang-cn" class="lang-btn active"><span class="lang-badge badge-cn">中</span> <span data-i18n="langCn">ภาษาจีน</span></button>
      <button id="lang-en" class="lang-btn"><span class="lang-badge badge-en">EN</span> <span data-i18n="langEn">ภาษาอังกฤษ</span></button>
    </div>
    <div class="home-actions">
      <button class="btn btn-blue" id="btn-practice"><span data-i18n="btnPractice">💪 ฝึกทบทวน (คำที่ใกล้ลืม)</span></button>
      <button class="btn btn-red" id="btn-mistakes"><span data-i18n="btnMistakes">📕 ทบทวนคำที่ตอบผิด</span> (<span id="mistake-count">0</span>)</button>
      <button class="btn btn-purple" id="btn-vocab"><span data-i18n="btnVocab">📚 คลังคำศัพท์</span> (<span id="learned-count">0</span>)</button>
    </div>
    <div id="unit-path"></div>
  </main>

  <!-- lesson -->
  <main id="screen-lesson" class="screen hidden">
    <div class="lesson-top">
      <button id="btn-quit" class="quit">✕</button>
      <div class="progress-outer"><div id="lesson-progress" class="progress-inner"></div></div>
      <div class="lesson-hearts">❤️ <span id="lesson-hearts">5</span></div>
    </div>
    <div id="exercise-area"></div>
    <div id="feedback" class="feedback hidden">
      <div id="feedback-text"></div>
      <button id="btn-continue" class="btn btn-green" data-i18n="continue">ต่อไป</button>
    </div>
  </main>

  <!-- vocab library -->
  <main id="screen-vocab" class="screen hidden">
    <div class="vocab-top">
      <button id="btn-vocab-back" class="quit">←</button>
      <h2 data-i18n="vocabTitle">คลังคำศัพท์</h2>
    </div>
    <div id="vocab-summary" class="vocab-summary"></div>
    <input id="vocab-search" class="type-input" data-i18n-placeholder="vocabSearch" placeholder="🔍 ค้นหา: จีน / พินอิน / อังกฤษ / ไทย" autocomplete="off">
    <div class="vocab-filters">
      <button class="vfilter active" data-f="learned" data-i18n="filterLearned">เรียนแล้ว</button>
      <button class="vfilter" data-f="weak" data-i18n="filterWeak">ใกล้ลืม</button>
      <button class="vfilter" data-f="mistakes" data-i18n="filterMistakes">ตอบผิดค้าง</button>
      <button class="vfilter" data-f="all" data-i18n="filterAll">ทั้งหมด</button>
    </div>
    <div id="vocab-list"></div>
  </main>

  <!-- results -->
  <main id="screen-results" class="screen hidden">
    <div class="results-card">
      <div class="results-emoji" id="results-emoji">🎉</div>
      <h2 id="results-title">จบบทเรียน!</h2>
      <div class="results-stats">
        <div class="rstat"><div class="rstat-label" data-i18n="resultsXp">XP ที่ได้</div><div class="rstat-value" id="results-xp">0</div></div>
        <div class="rstat"><div class="rstat-label" data-i18n="resultsAcc">ความแม่นยำ</div><div class="rstat-value" id="results-acc">0%</div></div>
      </div>
      <button class="btn btn-green" id="btn-home" data-i18n="backHome">กลับหน้าหลัก</button>
    </div>
  </main>
</div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
